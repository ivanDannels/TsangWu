syntax = "proto3";
package tsangwu.common;

message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
}

message PageRequest {
    uint64 page = 1;
    uint64 page_size = 2;
}

message PageResponse {
    uint64 total = 1;
    uint64 page = 2;
    uint64 page_size = 3;
    bool has_more = 4;
}
