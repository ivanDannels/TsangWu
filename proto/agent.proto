syntax = "proto3";
package tsangwu.agent;

service AgentService {
    rpc ExecuteAgent (ExecuteAgentRequest) returns (ExecuteAgentResponse);
    rpc GetAgentStatus (GetAgentStatusRequest) returns (AgentStatusResponse);
}

message ExecuteAgentRequest {
    string agent_name = 1;
    string task_id = 2;
    string instance_id = 3;
    string input_json = 4;
    string shared_context_json = 5;
}

message ExecuteAgentResponse {
    bool success = 1;
    string output_json = 2;
    repeated ArtifactInfo artifacts = 3;
    string error_msg = 4;
}

message ArtifactInfo {
    string name = 1;
    string content_type = 2;
    string storage_path = 3;
}

message GetAgentStatusRequest {
    string task_id = 1;
    string agent_name = 2;
}

message AgentStatusResponse {
    string status = 1;
    int32 progress = 2;
    string message = 3;
}
