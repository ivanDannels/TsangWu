syntax = "proto3";
package tsangwu.generation;

service GenerationService {
    rpc SubmitTask (SubmitTaskRequest) returns (SubmitTaskResponse);
    rpc GetTaskStatus (GetTaskStatusRequest) returns (TaskStatusResponse);
    rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse);
    rpc StreamProgress (StreamProgressRequest) returns (stream ProgressUpdate);
}

message SubmitTaskRequest {
    int64 project_id = 1;
    string scene_type = 2;
    string mode = 3;
    string input_json = 4;
    string config_json = 5;
    string user_uid = 6;
}

message SubmitTaskResponse {
    string task_id = 1;
    string status = 2;
}

message GetTaskStatusRequest {
    string task_id = 1;
}

message TaskStatusResponse {
    string task_id = 1;
    string status = 2;
    int32 progress = 3;
    string error_msg = 4;
    string output_json = 5;
}

message CancelTaskRequest {
    string task_id = 1;
}

message CancelTaskResponse {
    bool success = 1;
}

message StreamProgressRequest {
    string task_id = 1;
}

message ProgressUpdate {
    string task_id = 1;
    int32 progress = 2;
    string stage = 3;
    string message = 4;
}
