apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsangwu-server
  labels:
    app: tsangwu-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tsangwu-server
  template:
    metadata:
      labels:
        app: tsangwu-server
    spec:
      containers:
        - name: tsangwu-server
          image: tsangwu-server:latest
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          env:
            - name: TSANGWU_PROFILE
              value: distributed
            - name: TSANGWU_CONFIG_DIR
              value: /etc/tsangwu/config
            - name: RUST_LOG
              value: info
          envFrom:
            - secretRef:
                name: tsangwu-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/tsangwu/config
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: tsangwu-config
