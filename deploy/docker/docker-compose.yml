version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tsangwu
      POSTGRES_USER: tsangwu
      POSTGRES_PASSWORD: tsangwu_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsangwu"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tsangwu
      MINIO_ROOT_PASSWORD: tsangwu_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka

  tsangwu-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BIN_NAME: tsangwu-server
    environment:
      TSANGWU_PROFILE: standalone
      TSANGWU__DATABASE__TYPE: postgres
      TSANGWU__DATABASE__URL: postgres://tsangwu:tsangwu_dev@postgres:5432/tsangwu
      TSANGWU__CACHE__TYPE: redis
      TSANGWU__CACHE__URL: redis://redis:6379
      TSANGWU__STORAGE__TYPE: s3
      TSANGWU__STORAGE__ENDPOINT: http://minio:9000
      TSANGWU__STORAGE__BUCKET: tsangwu
      TSANGWU__STORAGE__ACCESS_KEY: tsangwu
      TSANGWU__STORAGE__SECRET_KEY: tsangwu_dev
      TSANGWU__MESSAGE_QUEUE__TYPE: kafka
      TSANGWU__MESSAGE_QUEUE__BROKERS: kafka:9092
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  pg_data:
  minio_data:
  kafka_data:
